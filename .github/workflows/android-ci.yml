name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Tests
        run: |
          dotnet restore tests/ImageForensics.Tests/ImageForensics.Tests.csproj
          dotnet test tests/ImageForensics.Tests/ImageForensics.Tests.csproj -c Release --no-restore
      - name: Restore app
        run: dotnet restore src/ImageForensics.App/ImageForensics.App.csproj
      - name: Create beta signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/beta.keystore" -storepass beta-ci-2026 -keypass beta-ci-2026 -alias beta -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Image Forensics Beta,O=CI,C=LY"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/beta.keystore" >> "$GITHUB_ENV"
      - name: Build installable Android APK
        run: >
          dotnet publish src/ImageForensics.App/ImageForensics.App.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$KEYSTORE_PATH"
          -p:AndroidSigningKeyAlias=beta
          -p:AndroidSigningKeyPass=beta-ci-2026
          -p:AndroidSigningStorePass=beta-ci-2026
          -o artifacts/android
      - name: SHA-256
        shell: bash
        run: |
          find artifacts/android -type f -name '*.apk' -print -exec sha256sum {} \; | tee artifacts/android/SHA256SUMS.txt
          echo "NOTE: CI beta key is ephemeral. Uninstall older beta builds before installing a build from a different CI run." > artifacts/android/SIGNING-NOTE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-forensics-android-apk
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
            artifacts/android/SIGNING-NOTE.txt
          if-no-files-found: error
