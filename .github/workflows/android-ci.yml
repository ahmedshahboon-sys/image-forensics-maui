name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore tests
        run: dotnet restore tests/ImageForensics.Tests/ImageForensics.Tests.csproj
      - name: Run unit tests
        run: dotnet test tests/ImageForensics.Tests/ImageForensics.Tests.csproj -c Release --no-restore
      - name: Restore Android app
        run: dotnet restore src/ImageForensics.App/ImageForensics.App.csproj
      - name: Build Android APK
        run: >
          dotnet publish src/ImageForensics.App/ImageForensics.App.csproj
          -c Release
          -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -o artifacts/android
      - name: SHA-256
        shell: bash
        run: |
          find artifacts/android -type f -name '*.apk' -print -exec sha256sum {} \; | tee artifacts/android/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-forensics-android-apk
          path: |
            artifacts/android/*.apk
            artifacts/android/SHA256SUMS.txt
          if-no-files-found: error
